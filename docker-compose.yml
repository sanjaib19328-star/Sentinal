services:

  mysql:
    image: mysql:8.4
    container_name: sentinel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sentinel}
      MYSQL_USER: ${DB_USERNAME:-sentinel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sentinel_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - sentinel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sentinel", "-psentinel_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sentinel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  sentinel-api:
    build:
      context: ./backend/sentinel-api
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-sentinel}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-sentinel}
      DB_PASSWORD: ${DB_PASSWORD:-sentinel_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-sentinel-super-secret-jwt-key-minimum-256-bits-for-security-assurance-key}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  sentinel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - sentinel-api

volumes:
  sentinel_mysql_data:
  sentinel_redis_data:
