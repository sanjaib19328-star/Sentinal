spring:
  application:
    name: sentinel-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true
      resolve-lazily: true
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/sentinel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:sentinel}
    password: ${DB_PASSWORD:sentinel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: ${REDIS_TIMEOUT:10000ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:10000ms}
      
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial Baseline"

sentinel:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
  jwt:
    secret: ${JWT_SECRET:sentinel-super-secret-jwt-key-minimum-256-bits-for-security-assurance-key}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  gateway:
    default-timeout-ms: ${GATEWAY_TIMEOUT_MS:5000}
    max-body-size: ${GATEWAY_MAX_BODY_SIZE:10485760} # 10MB
    max-header-size: ${GATEWAY_MAX_HEADER_SIZE:16384} # 16KB
  security:
    ssrf:
      allow-local: ${SENTINEL_SSRF_ALLOW_LOCAL:true}
    encryption-key: ${SENTINEL_ENCRYPTION_KEY:sentinel-default-aes256-encryption-key-for-credentials-32b}

server:
  port: ${PORT:8080}
  max-http-request-header-size: ${SERVER_MAX_HTTP_HEADER_SIZE:16384}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
