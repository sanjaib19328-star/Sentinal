spring:
  application:
    name: sentinel-api-test

  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3307/sentinel_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${TEST_DB_USERNAME:sentinel}
    password: ${TEST_DB_PASSWORD:sentinel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial Baseline"

  servlet:
    multipart:
      enabled: true
      resolve-lazily: true
      max-file-size: 50MB
      max-request-size: 50MB

sentinel:
  jwt:
    secret: ${JWT_SECRET:sentinel-super-secret-jwt-key-minimum-256-bits-for-security-assurance-key}
    expiration: 86400000
  cors:
    allowed-origins: "*"
  gateway:
    default-timeout-ms: 5000
    max-body-size: 10485760
    max-header-size: 16384
  security:
    ssrf:
      allow-local: true
    encryption-key: sentinel-default-aes256-encryption-key-for-credentials-32b

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
